name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - run: uv run ruff check packages services scripts
      - run: uv run ruff format --check packages services scripts
      - run: uv run mypy packages/core/src
      - run: uv run pytest

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # Lint only — a `pulumi preview` would need AWS credentials.
      - run: uvx ruff check pulumi/components pulumi/__main__.py
      - run: uvx ruff format --check pulumi/components pulumi/__main__.py
