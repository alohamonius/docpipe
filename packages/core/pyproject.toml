[project]
name = "docpipe-core"
version = "0.1.0"
description = "Shared library for docpipe services: models, storage, queue, Bedrock client, observability"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "moto[s3,dynamodb,sqs]>=5.0",
    "mypy>=1.13",
    "boto3-stubs[s3,dynamodb,sqs,bedrock-runtime]>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docpipe_core"]
