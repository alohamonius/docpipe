[project]
name = "docpipe"
version = "0.0.0"
description = "Workspace root — see packages/ and services/"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests"]
# services/ are thin shells with no package of their own; their envelope tests
# import them by file name (`import chat` is services/api/chat.py).
pythonpath = ["services/api"]
addopts = "-q"
