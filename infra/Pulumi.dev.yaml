config:
  aws:region: us-east-1
  # Uses the same named profile the CLI/tests use. In CI, unset this and rely on
  # the ambient credential chain (env vars / OIDC).
  aws:profile: docpipe
  docpipe:namePrefix: docpipe-dev
  # Aurora, in two flags, because it takes two applies with a SQL step between.
  # Bedrock validates the DB connection when it creates the KB, so the table and
  # the bedrock_user role must exist BEFORE enableAuroraKb flips:
  #
  #   1. enableAurora: true   → pulumi up          (cluster, Data API, secret)
  #   2. AWS_PROFILE=docpipe python scripts/aurora_bootstrap.py
  #   3. enableAuroraKb: true → pulumi up          (the KB attaches)
  #
  # min_acu=0 when on, so ACU billing pauses when idle (storage/backup do not,
  # ≈$0.12/mo). The ~15s resume on the first query is accepted — 2026-08-14.
  docpipe:enableAurora: "true"
  docpipe:enableAuroraKb: "true"
  # Two models, both DeepSeek. Summary = R1 (INFERENCE_PROFILE-only, no tool
  # use); chat = v3.2 (ON_DEMAND, tool use). chatModelId is stated explicitly
  # rather than left to the code default in __main__.py:21 — one config value
  # used to feed both IAM statements, and that bug was invisible precisely
  # because the value was implicit.
  docpipe:bedrockModelId: us.deepseek.r1-v1:0
  docpipe:chatModelId: deepseek.v3.2
